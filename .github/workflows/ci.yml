name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Verify stop-write protections
        run: python3 deploy/test_release_guards.py
      - name: Build and smoke test isolated production stack
        run: ./deploy/smoke-compose.sh
      - name: Verify benchmark failure and isolation contracts
        run: python3 -m unittest discover -s benchmarks/tests -v
      - name: Smoke test benchmark with local model fixture
        run: python3 -m benchmarks smoke --run output/benchmarks/ci-smoke
      - name: Upload benchmark smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-report
          path: |
            output/benchmarks/ci-smoke/report.md
            output/benchmarks/ci-smoke/summary.json
          if-no-files-found: ignore

  observability:
    name: Observability configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate Collector
        run: docker run --rm -v "$PWD/deploy:/config:ro" otel/opentelemetry-collector-contrib:0.165.0 validate --config=/config/otel-collector.yaml
      - name: Validate Prometheus configuration
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml
      - name: Verify alert behavior
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v3.16.0 test rules /etc/prometheus/alerts.test.yml

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_ci
          POSTGRES_USER: rag_ci
          POSTGRES_PASSWORD: rag_ci_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_ci -d rag_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: '1'
      GOFLAGS: -mod=readonly
      # Disposable job-local fixture only; never use a deployment database here.
      RAG_TEST_POSTGRES_DSN: postgres://rag_ci:rag_ci_fixture@127.0.0.1:5432/rag_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Initialize PostgreSQL test extension
        run: psql "$RAG_TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck tests
        run: npm run typecheck:test
      - name: Test
        run: npm test
      - name: Typecheck, build and verify route chunks
        run: npm run build
