receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s

exporters:
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
    sending_queue:
      queue_size: 512
    retry_on_failure:
      max_elapsed_time: 30s
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    send_timestamps: true
    metric_expiration: 2m
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
