apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          url: 'http://localhost:16686/trace/$${__value.raw}'
          urlDisplayLabel: 在 Jaeger 查看 Trace
